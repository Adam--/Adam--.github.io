# Site settings
title: Adam Anderson
author: Adam Anderson
tagline: Building amazing software engineering teams
description: >- # this means to ignore newlines until "baseurl:"
  Adam Anderson — engineering leadership, .NET, Python, and developer tooling.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.adamanderson.dev" # the base hostname & protocol for your site

# Card
# Square headshot shown on the card, also used as the og:image.
avatar: /assets/img/avatar.jpg
avatar_light: /assets/img/avatar-light.jpg

# Social
github_username: adam--
linkedin_username: adamblanderson

# Build settings
# No `theme:` key — layouts and styles are local to this repo (_layouts,
# _includes, assets/css/main.css). Do not add a `permalink:` key: the default
# /:categories/:year/:month/:day/:title.html is what the existing posts are
# already published under.
plugins:
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
